# The CRD types and the generated deepcopy methods
api:
  - changed-files:
      - any-glob-to-any-file:
          - "api/**"
          - "config/crd/**"

# The Redirect and ShortLink reconcilers
controller:
  - changed-files:
      - any-glob-to-any-file:
          - "internal/controller/**"
          - "config/rbac/**"

# The HTTP server: redirects, the shortlink API and its client
server:
  - changed-files:
      - any-glob-to-any-file:
          - "pkg/**"
          - "html/**"
          - "docs/**"

# Kubernetes manifests (kustomize) and the entrypoint
deploy:
  - changed-files:
      - any-glob-to-any-file:
          - "config/**"
          - "cmd/**"
          - "Dockerfile"

# Tests
tests:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*_test.go"
          - "test/**"

# Documentation
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/*.drawio"

# Build, release, and CI plumbing
build:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".release-please-config.json"
          - ".release-please-manifest.json"
          - ".mise.toml"
          - ".golangci.yaml"
          - ".custom-gcl.yml"
          - ".pre-commit-config.yaml"
          - ".yamllint.yaml"
          - ".editorconfig"
          - ".dockerignore"
          - "codecov.yml"
          - "renovate.json"
          - "go.mod"
          - "go.sum"

# Add 'enhancement' to any PR whose head branch starts with `feat` or `feature`
enhancement:
  - head-branch:
      - "^feat"
      - "^feature"

# Add 'bug' to any PR whose head branch starts with `fix` or `bug`
bug:
  - head-branch:
      - "^fix"
      - "^bug"
